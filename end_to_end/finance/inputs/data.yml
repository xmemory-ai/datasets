# Field change — account freeze.
- write:
    query: "Account 1001-A has been temporarily frozen due to suspicious activity."
    categories:
      - field_change

- read:
    query: "What is the current status of account 1001-A?"
    categories:
      - single_fact_lookup
      - state
    labels:
      single_answer: "frozen"

- read:
    query: "How many non-frozen accounts are currently held at Pacific First Bank?"
    categories:
      - aggregation
      - relational
      - state
      - negative_exclusion
    labels:
      single_answer: "1"

# Field change — risk profile update.
- write:
    query: "Following a lifestyle change, Laura Simmons has updated her investor profile. Her risk profile is now conservative."
    categories:
      - field_change

- read:
    query: "What is Laura Simmons's current risk profile?"
    categories:
      - single_fact_lookup
      - state
    labels:
      single_answer: "conservative"

# Field change — relocation.
- write:
    query: "Mark Chen has relocated. He now lives in Denver."
    categories:
      - field_change

- read:
    query: "In which city does Mark Chen currently reside?"
    categories:
      - single_fact_lookup
      - state
    labels:
      single_answer: "Denver"

# Field clearance — sector reclassification pending.
- write:
    query: "TSLA's market sector classification is being re-evaluated by the exchange and is no longer on file pending review."
    categories:
      - field_clearance

- read:
    query: "Which sector does TSLA belong to?"
    categories:
      - single_fact_lookup
      - state
    labels:
      single_answer: "unknown"

- read:
    query: "Which stocks currently do not belong to energy sector?"
    categories:
      - aggregation
      - state
      - negative_exclusion
    labels:
      single_answer: "TSLA, AAPL"

# Link change — account moves to a different bank.
- write:
    query: "Account 2044-C has been transferred from Pacific First Bank to Summit Trust Bank, which is headquartered in Chicago."
    categories:
      - link_change

- read:
    query: "At which bank is account 2044-C now held?"
    categories:
      - single_fact_lookup
      - state
      - relational
    labels:
      single_answer: "Summit Trust Bank"

- read:
    query: "How many accounts are now held at Pacific First Bank?"
    categories:
      - aggregation
      - relational
      - state
    labels:
      single_answer: "1"

# Link deletion — stock sold off.
- write:
    query: "Mark Chen has sold off all of his shares of XOM and no longer holds that position."
