      - single_fact_lookup
    labels:
      single_answer: "Seattle"

- read:
    query: "What is Laura Simmons's risk profile?"
    categories:
      - single_fact_lookup
    labels:
      single_answer: "moderate"

- read:
    query: "At which bank is account 1001-A held?"
    categories:
      - single_fact_lookup
      - relational
    labels:
      single_answer: "Pacific First Bank"

- read:
    query: "Where is Meridian Securities headquartered?"
    categories:
      - single_fact_lookup
    labels:
      single_answer: "New York"

- read:
    query: "What account type is 5500-B?"
    categories:
      - single_fact_lookup
    labels:
      single_answer: "brokerage"

- read:
    query: "Which stocks does Mark Chen hold?"
    categories:
      - aggregation
      - relational
    labels:
      single_answer: "TSLA, XOM"

- read:
    query: "Which sector does AAPL belong to?"
    categories:
      - single_fact_lookup
    labels:
      single_answer: "technology"

- read:
    query: "How many accounts does Laura Simmons own?"
