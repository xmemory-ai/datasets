# Initial state
- write:
    query: "Laura Simmons lives in Seattle and has a moderate risk profile. She holds checking account 1001-A at Pacific First Bank, which is headquartered in San Francisco."

- write:
    query: "Laura Simmons also owns a brokerage account 5500-B at Meridian Securities, headquartered in New York. Both of her accounts are currently active."

- write:
    query: "Mark Chen lives in Austin and has an aggressive risk profile. He holds savings account 2044-C at Pacific First Bank. The account is active."

- write:
    query: "Laura Simmons holds shares of AAPL, a technology stock for Apple Inc."

- write:
    query: "Mark Chen holds shares of TSLA, a technology stock for Tesla Inc., and shares of XOM, an energy stock for Exxon Mobil Corporation."

- read:
