name: "Splitwise benchmark dataset generated from fulltest.json"
author: "DimaK"
created_at: 2026-04-27
inputs:
  - data.yml
scenario:
  passthrough_yml: {}
instance_setup:
  from_plaintext_description:
    description: |-
      This agent tracks shared outings for a group of exactly 10 people: Amara, Amina, Carlos, Diego, Fatima, Hiroshi, Lars, Leila, Priya, and Yuki. For each outing, record who attended, the total bill in dollars, and who paid; the total splits evenly across everyone who attended that specific outing, so each attendee owes the payer their equal share of that bill. When an expense message does not explicitly name which subset attended, assume the full group of all 10 participated. Store every outing's date in the database as YYYY-MM-DD (for example, 2026-01-15) no matter how the source message phrases it, and treat outings at the same place or of the same type on different calendar dates as distinct events that must never be merged. Later questions about balances or debts will be answered using this even-split model.
