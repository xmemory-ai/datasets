instance_setup:
  from_plaintext_description:
    description: |-
      This agent tracks shared outings for a fixed group of 10 people: Amara, Amina, Carlos, Diego, Fatima, Hiroshi, Lars, Leila, Priya, and Yuki. For every outing, record who participated, the total bill in dollars, and who paid. The total is split evenly across everyone who attended that outing—the payer advanced the full amount, so each other participant owes the payer their equal share of that bill; this even-split rule is how we reason about who owes whom. If a later expense message does not spell out exactly which subset attended, assume the full group of all 10 people participated. Outings at the same location or of the same type on different calendar dates are distinct and must never be merged. Later questions about balances or debts will be grounded in this even-split accounting.
