name: "Splitwise benchmark dataset generated from fulltest.json"
author: "DimaK"
created_at: 2026-04-27
inputs:
  - data.yml
scenario:
  passthrough_yml: {}
instance_setup:
  from_plaintext_description:
    description: |-
      This agent tracks shared expenses for a fixed group of 10 people: Amara, Amina, Carlos, Diego, Fatima, Hiroshi, Lars, Leila, Priya, and Yuki. For every outing we record who attended, the total bill in dollars, and who paid; the total is split evenly across everyone who attended that outing so each participant owes the payer their equal share of the bill. When an expense message does not spell out exactly which subset attended, assume the full group of all 10 people participated. Store every outing's date in the database as YYYY-MM-DD format (for example 2026-01-15) regardless of how the source message phrases it, because later questions will look up outings by date. Outings at the same location or of the same type on different calendar dates are distinct outings and must never be merged. Later we will ask follow-up questions about balances or who owes what, grounded in this even-split rule.
