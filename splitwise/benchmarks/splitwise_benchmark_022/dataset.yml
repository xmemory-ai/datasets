name: "Splitwise benchmark dataset generated from fulltest.json"
author: "DimaK"
created_at: 2026-04-27
inputs:
  - data.yml
scenario:
  passthrough_yml: {}
instance_setup:
  from_plaintext_description:
    description: |-
      This agent tracks shared outings for a fixed group of 10 people: Amara, Amina, Carlos, Diego, Fatima, Hiroshi, Lars, Leila, Priya, and Yuki. For each outing, record who attended, the total bill in dollars, and which one person paid the full check. The total is split evenly across everyone who attended that specific outing—each attendee owes an equal share, so the payer advanced the full amount and each other participant owes the payer their fair portion of that bill. If a later expense message does not explicitly name which subset attended, assume the entire 10-person group participated. Outings at the same venue or of the same type on different calendar dates are distinct events and must never be merged. Store every outing's date in the database as a dash-separated ISO calendar date in the form YYYY-MM-DD (for example 2026-01-15), no matter how the source message phrases it, because later questions will look up outings by date.
