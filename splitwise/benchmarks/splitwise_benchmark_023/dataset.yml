name: "Splitwise benchmark dataset generated from fulltest.json"
author: "DimaK"
created_at: 2026-04-27
inputs:
  - data.yml
scenario:
  passthrough_yml: {}
instance_setup:
  from_plaintext_description:
    description: |-
      This agent tracks shared outings for a fixed group of 10 people: Amara, Amina, Carlos, Diego, Fatima, Hiroshi, Lars, Leila, Priya, and Yuki. For each outing record who attended, the total bill in dollars, and which one person paid the full check; the total splits evenly across everyone who attended that outing so each participant owes the payer their equal share, and this even-split model is how we reason about debts. When an expense message does not explicitly name which subset attended, assume the full group of all 10 participated. Outings at the same venue or of the same type on different calendar dates are distinct events and must never be merged; store every outing's date in YYYY-MM-DD format (for example 2026-01-15) so later date-based lookups work correctly.
