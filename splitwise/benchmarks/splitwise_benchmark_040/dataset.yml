instance_setup:
  from_plaintext_description:
    description: |-
      This agent tracks shared outings for a group of 10 people: Amara, Amina, Carlos, Diego, Fatima, Hiroshi, Lars, Leila, Priya, and Yuki. For each outing, record who participated, the total bill in dollars, and who paid the full check. The total is split evenly across everyone who attended that outing; the payer advanced the entire amount, so each other participant owes the payer their equal share of that bill. When an expense message does not explicitly name which subset attended, assume the full group of all 10 people participated. Outings at the same location or of the same type on different calendar dates are distinct and must never be merged. Later questions about balances or debts will be grounded in this even-split model.
