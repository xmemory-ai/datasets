name: "Splitwise benchmark dataset generated from fulltest.json"
author: "DimaK"
created_at: 2026-04-27
inputs:
  - data.yml
scenario:
  passthrough_yml: {}
instance_setup:
  from_plaintext_description:
    description: |-
      This agent tracks shared outings for a fixed group of 10 people: Amara, Amina, Carlos, Diego, Fatima, Hiroshi, Lars, Leila, Priya, and Yuki. For each outing we record who attended, the total bill in dollars, and who paid the full check. The total is split evenly across everyone who attended that specific outing, so each attendee owes the payer an equal share of the bill—this even-split rule is how we reason about what each participant owes. If a later expense message does not explicitly name which subset attended, assume the entire 10-person group participated. Outings at the same venue or of the same type on different calendar dates are distinct events and must not be merged. Store every outing's date in the database as YYYY-MM-DD format (for example 2026-01-15), regardless of how the date is phrased in the source message, because later questions will look up outings by this canonical date. We will later ask follow-up questions about what is owed, grounded in this even-split accounting model.
